[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-ai-research-kit"
version = "0.1.0"
description = "Small, auditable research utilities for retrieval and water-AI experiment preparation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []
keywords = ["reproducibility", "retrieval", "hydrology", "data-leakage"]

[project.scripts]
water-ai = "water_ai_research.cli:main"

[tool.setuptools.packages.find]
include = ["water_ai_research*"]
