name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with the runner's Python 3
        run: python3 -m unittest discover -s tests -v
      - name: Run the offline synthetic example
        run: python3 -m water_ai_research demo --output outputs/ci-demo
      - name: Verify generated artifacts
        run: python3 -m water_ai_research verify outputs/ci-demo
